<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>pokimon</h1>
    <button id="stop">Stop</button>
</body>
<script>


    const sayAston = function(){
        console.log("Aston");
    }   
     //setTimeout(sayAston,5000)//here only giving reference of function



    const changeText = function(){
        document.querySelector('h1').innerHTML = "hello how are you"
    }
    //setTimeout(changeText,5000)


   const changeMe = setTimeout(changeText, 5000)//here just holding in variable and changing text after 5 seconds

     document.querySelector('#stop').addEventListener('click', function(){//stop is button id 
      clearTimeout(changeMe)
        console.log("STOPPED")//when i press stop before 5 seconds it stops changing
     })
</script>
</html>
