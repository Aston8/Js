<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Profile Card</title>
    <style>
        .profile-card {
            max-width: 300px;
            border: 1px solid #ccc;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            text-align: center;
        }
        .profile-card img {
            width: 100px;
            border-radius: 50%;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="profile-card" id="profile-card">
        <img src="" alt="Profile Picture" id="profile-picture">
        <p>Followers: <span id="followers-count"></span></p>
    </div>

    <script>
        const requestUrl = 'https://api.github.com/users/hiteshchoudhary';
        const xhr = new XMLHttpRequest();
        xhr.open('GET', requestUrl);
        xhr.onreadystatechange = function(){
            if (xhr.readyState === 4 && xhr.status === 200) {
                const data = JSON.parse(this.responseText);
                const profilePicture = data.avatar_url;
                const followersCount = data.followers;
                document.getElementById('profile-picture').src = profilePicture;
                document.getElementById('followers-count').textContent = followersCount;
            }
        };
        xhr.send();
    </script>
</body>
</html>
